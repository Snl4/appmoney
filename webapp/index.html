<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Мій бюджет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app">
    <header class="ios-header">
      <button type="button" id="monthPrev" class="icon-btn">‹</button>
      <h1 id="monthTitle">Бюджет</h1>
      <button type="button" id="monthNext" class="icon-btn">›</button>
    </header>

    <main id="screen-home" class="screen active">
      <div class="cards">
        <div class="card balance-card">
          <span class="card-label">Залишок</span>
          <span class="card-value" id="balanceVal">—</span>
        </div>
        <div class="card-row">
          <div class="card small income-card">
            <span class="card-label">Доходи</span>
            <span class="card-value sm" id="incomeVal">—</span>
          </div>
          <div class="card small expense-card">
            <span class="card-label">Витрати</span>
            <span class="card-value sm" id="expenseVal">—</span>
          </div>
        </div>
        <div class="card daily-card">
          <span class="card-label">Можна витрачати на день</span>
          <span class="card-value md" id="dailyVal">—</span>
        </div>
      </div>
      <section class="section">
        <h2>Операції</h2>
        <div id="eventsList" class="events-list"></div>
      </section>
    </main>

    <main id="screen-add" class="screen">
      <div class="segmented">
        <button type="button" class="seg active" data-type="expense">Витрата</button>
        <button type="button" class="seg" data-type="income">Дохід</button>
      </div>
      <div class="amount-display" id="amountDisplay">0 ₴</div>
      <div class="keypad" id="keypad"></div>
      <div class="section">
        <h2>Категорія</h2>
        <div id="categoryGrid" class="category-grid"></div>
      </div>
      <label class="toggle-row" id="recurringRow">
        <span>Щомісячний платіж</span>
        <input type="checkbox" id="recurringCheck">
        <span class="toggle"></span>
      </label>
      <button type="button" class="btn-primary" id="saveBtn">Зберегти</button>
    </main>

    <main id="screen-settings" class="screen">
      <div class="settings-list" id="settingsList"></div>
    </main>

    <nav class="tab-bar">
      <button type="button" class="tab active" data-tab="home">
        <span class="tab-icon">📊</span><span>Огляд</span>
      </button>
      <button type="button" class="tab tab-add" data-tab="add">
        <span class="tab-icon-add">＋</span>
      </button>
      <button type="button" class="tab" data-tab="settings">
        <span class="tab-icon">⚙️</span><span>Ще</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
